<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="68%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08090A" stop-opacity="0"/>
    </radialGradient>
    <filter id="lineglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="#08090A"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="432" y2="300" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="80" y1="220" x2="432" y2="220" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Rising trend line with glow -->
  <polyline
    points="80,360 170,295 256,315 344,215 432,128"
    fill="none" stroke="#00D4AA" stroke-opacity="0.35" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#lineglow)"
  />
  <polyline
    points="80,360 170,295 256,315 344,215 432,128"
    fill="none" stroke="#00D4AA" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- Glow halo at endpoint -->
  <circle cx="432" cy="128" r="40" fill="#00D4AA" fill-opacity="0.15"/>
  <circle cx="432" cy="128" r="24" fill="#00D4AA"/>
</svg>
